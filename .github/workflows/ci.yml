name: Node.js CI/CD

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["*"]
  workflow_dispatch: # Allow manual triggering

jobs:
  setup:
    name: Build and Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Deno 2.9.8
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.8

      - name: Setup Bun 1.2.19
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Setup Node.js 22.23.2
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: Clean install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Type check (TypeScript 7, non-blocking trial)
        continue-on-error: true
        run: npm exec --yes --package=typescript@7 -- tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Format check
        if: runner.os == 'Linux' # Windows checkouts use CRLF (core.autocrlf); formatting is platform-independent
        run: npm run format:check

      - name: Run tests (with coverage)
        run: npm run test:coverage && npm run parse-r && npm run parse-fd && npm run test:deno && npm run test:bun
